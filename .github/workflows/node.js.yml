
name: Lavage Tracker CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Build and lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Format TypeScript source
        run: npx prettier --write "src/**/*.{ts,tsx}" "vite.config.ts"

      - name: Commit formatting changes to the current development branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src vite.config.ts
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
          else
            git commit -m "chore: format TypeScript source [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Check code quality
        run: npm run lint

      - name: Build application
        run: npm run build

name: HVIE worker checks

on:
  push:
    branches:
      - feature/lavage-platform-foundation
    paths:
      - "reconstruction-worker/**"
      - ".github/workflows/hvie-worker.yml"
  pull_request:
    branches:
      - feature/lavage-platform-foundation
    paths:
      - "reconstruction-worker/**"
      - ".github/workflows/hvie-worker.yml"

jobs:
  test-worker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned COLMAP and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y colmap=3.9.1-2build2 python3 python3-pil
      - name: Verify COLMAP installation
        run: colmap -h
      - name: Compile worker
        run: python3 -m py_compile reconstruction-worker/reconstruct.py
      - name: Run worker unit tests
        working-directory: reconstruction-worker
        run: python3 -m unittest discover -s tests -v
